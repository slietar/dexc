[build-system]
requires = ["oryn~=1.3"]
build-backend = "oryn"

[project]
name = "dexc_tests"
version = "0.0.0"
requires-python = "~=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "dexc",
    "ipykernel==6.29.5",
    "jax>=0.5.3",
    "matplotlib>=3.10.1",
    "numpy>=2.2.4",
    "polars>=1.27.1",
    "scipy>=1.15.2",
]

[tool.oryn]
include = ["dexc_tests"]
